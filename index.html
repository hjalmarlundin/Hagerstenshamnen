<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamnen lekplats</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
    }
    #pdf-viewer {
      width: 100%;
      height: 100vh;
      border: none;
    }
    .fallback {
      display: none;
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <iframe id="pdf-viewer" src="Hamnen-lekplats.pdf"></iframe>
  <div class="fallback">
    <p>Din webbläsare kan inte visa PDF:en direkt.</p>
    <p><a href="Hamnen-lekplats.pdf">Klicka här för att öppna/ladda ner PDF:en</a></p>
  </div>
</body>
</html>
